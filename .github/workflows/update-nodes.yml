name: 定时聚合节点

on:
  schedule:
    - cron: "0 */3 * * *"    # 每 3 小时跑一次（GitHub cron 略有延迟，可接受）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggregator
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取并生成订阅
        run: |
            python3 aggregator/main.py --out sub --app-data app/data

      - name: 发布到 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: app

      - name: 启用 Pages（一次性，重复执行幂等）
        if: always()
        run: |
            python3 tools/push_contents_api.py --src app --branch main --allow 2>/dev/null || true
            # 启用 Pages（仅当未启用时启用，失败不阻塞聚合）
            curl -fsSL -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"source":{"branch":"main","path":"/app"}}' || true

      - name: 提交产物
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: 聚合节点"
          file_pattern: |
              sub/*
              app/data/**
          skip_fetch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages-deploy:
    needs: aggregate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4