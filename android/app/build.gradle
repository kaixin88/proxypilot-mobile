plugins {
    id 'com.android.application'
}

android {
    namespace 'com.proxypilot.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.proxypilot.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // debug 自带 keystore，无需配置
            minifyEnabled false
        }
        release {
            // 默认 release 用 debug 签名，先让产物能装上；正式上架前再换成自己的 release 密钥
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 只用系统 WebView，不再拉 appcompat（避免拖入旧版 Kotlin stdlib 引发类重复）
    implementation 'androidx.annotation:annotation:1.8.2'
}